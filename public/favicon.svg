<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="8" fill="#0f172a"/>
  
  <!-- Stethoscope icon -->
  <!-- Circle head of stethoscope -->
  <circle cx="10" cy="10" r="5" fill="none" stroke="#22c55e" stroke-width="2"/>
  <circle cx="10" cy="10" r="2" fill="#22c55e"/>
  
  <!-- Tube going right then down then curving -->
  <path d="M15 10 Q22 10 22 16 Q22 24 16 24" 
